plugins { id 'com.android.application' }

android {
    namespace 'dev.codexcrew.mobile'
    compileSdk 36
    // Sideload builds handle real sessions too; do not expose app data to ADB.
    buildTypes {
        debug { debuggable false }
        release { debuggable false }
    }
    defaultConfig {
        applicationId 'dev.codexcrew.mobile'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
