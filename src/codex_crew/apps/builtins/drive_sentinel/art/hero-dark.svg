  <line x1="60" y1="214" x2="740" y2="214" stroke="#274a39" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" font-size="12" fill="#72a183">
    <text x="60" y="234">measure</text>
    <text x="230" y="234">tier by risk</text>
    <text x="410" y="234">dry run</text>
