AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CodexCrew One-Click Deploy - in-account scheduled reaper. An EventBridge rule
  fires a Lambda on a timer; the Lambda deletes expired non-persistent deploys
  (S3 prefix + CloudFront behavior/origin + backend CloudFormation stack). Runs
  entirely in the user's account - no local creds, no human. Install once.

Parameters:
  Bucket:
    Type: String
  DistributionId:
    Type: String
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  ScheduleRate:
    Type: String
    Default: 'rate(1 hour)'
  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Optional. When set, a CloudWatch alarm on reaper Lambda errors notifies
      this address via SNS. A reaper that fires on schedule but throws every
      run otherwise fails SILENTLY while expired deployments leak forever.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:

  ReaperRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: codexcrew-deploy-reaper-exec
      # R23 F1: mandatory boundary — installer's iam:CreateRole is conditioned on it.
      PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/codexcrew-deploy-app-boundary'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Least privilege: everything scoped to codexcrew-deploy-app-*
      # resources + the shared bucket + the one distribution. The only broad
      # action is apigateway:DELETE on /apis/* (HTTP API ids are random and
      # cannot be name-scoped); a future hardening is tag-based scoping.
      Policies:
        - PolicyName: reaper
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3List
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !Sub 'arn:aws:s3:::${Bucket}'
              - Sid: S3Objects
                Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject, s3:PutObject]
                Resource: !Sub 'arn:aws:s3:::${Bucket}/*'
              - Sid: CloudFront
                Effect: Allow
                Action: [cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:CreateInvalidation]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${DistributionId}'
              - Sid: CloudFrontEngineSites
                Effect: Allow
                # R20 F3: ListTagsForResource is required by the R19 tag-verify
                # gate — without it the gate errors and finite-TTL engine
                # deployments are never reaped.
                Action: [cloudfront:GetDistributionConfig, cloudfront:UpdateDistribution, cloudfront:DeleteDistribution, cloudfront:ListTagsForResource]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'
                # F6 (R9): Scope DeleteDistribution to per-site distributions only.
                # Engine.py tags per-site distributions with codexcrew:site=<site_id>
                # (value is the site id, NOT 'true'). The shared base-stack
                # distribution carries codexcrew:managed=true but NOT codexcrew:site.
                # Using a presence test (Null: false) prevents the reaper from
                # accidentally deleting the shared distribution.
                # NOTE: StringEquals 'true' would be a DEAD condition since the tag
                # value is a site id string, not the literal 'true'.
                Condition:
                  'Null':
                    'aws:ResourceTag/codexcrew:site': 'false'
              # F7: OAC lifecycle — List cannot be tag-scoped (returns all OACs
              # in the account); Get/Delete scoped to the account's OAC ARNs.
              # Required to prevent OAC quota exhaustion on repeated deployments.
              - Sid: CloudFrontOACCleanup
                Effect: Allow
                Action: [cloudfront:ListOriginAccessControls]
                Resource: '*'
              - Sid: CloudFrontOACManage
                Effect: Allow
                Action: [cloudfront:GetOriginAccessControl, cloudfront:DeleteOriginAccessControl]
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*'
              - Sid: S3EngineSites
                Effect: Allow
                Action: [s3:ListBucket, s3:DeleteBucket, s3:GetBucketTagging]
                Resource: 'arn:aws:s3:::codexcrew-web-*'
              - Sid: S3EngineSiteObjects
                Effect: Allow
                Action: [s3:GetObject, s3:DeleteObject]
                Resource: 'arn:aws:s3:::codexcrew-web-*/*'
              # ── Documented scoped exception (CWE-269) ──
              # The reaper's whole job is unattended teardown of expired deploys,
              # so it MUST hold cloudformation:DeleteStack (Sid Cfn) and the
              # teardown-only IAM verbs iam:DeleteRole/DeleteRolePolicy/
              # DetachRolePolicy (Sid CascadeIam). Removing them would defeat the
              # feature. This is accepted, not an oversight, because the grant is
              # tightly bounded and cannot escalate:
              #   * NO privilege-escalation verbs — no CreateRole, PutRolePolicy,
              #     AttachRolePolicy, UpdateAssumeRolePolicy, PassRole,
              #     SetDefaultPolicyVersion. Only Delete*/Detach*/Get*/List*.
              #   * Every ARN is prefix-scoped to codexcrew-deploy-app-* (roles,
              #     stacks, functions, tables) — never '*'.
              #   * The role is Lambda-assumed and itself carries the
              #     codexcrew-deploy-app-boundary permissions boundary (below).
              # Net: a reaper compromise can only delete the ephemeral deploy
              # resources it manages, not mutate account-wide IAM.
              - Sid: Cfn
                Effect: Allow
                Action: [cloudformation:DescribeStacks, cloudformation:DeleteStack]
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/codexcrew-deploy-app-*/*'
              - Sid: CascadeCompute
                Effect: Allow
                Action:
                  - lambda:GetFunction
                  - lambda:DeleteFunction
                  - lambda:RemovePermission
                  - lambda:GetFunctionUrlConfig
                  - lambda:DeleteFunctionUrlConfig
                  - dynamodb:DescribeTable
                  - dynamodb:DeleteTable
                Resource:
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:codexcrew-deploy-app-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/codexcrew-deploy-app-*'
              - Sid: CascadeIam
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/codexcrew-deploy-app-*-exec'
                  # Origin-verify authorizer role (app-apigw*.yaml) — without this
                  # the stack delete leaves the -authz role behind (DELETE_FAILED).
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:role/codexcrew-deploy-app-*-authz'
              - Sid: CascadeApiGwRead
                Effect: Allow
                Action: [apigateway:GET]
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
              - Sid: CascadeApiGwDelete
                Effect: Allow
                Action: [apigateway:DELETE]
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/apis/*'
                # HTTP API ids are random and cannot be name-scoped; constrain
                # DELETE to APIs carrying the managed tag (set by app templates)
                # so a reaper bug or Lambda compromise cannot delete unrelated
                # API Gateways in the account.
                Condition:
                  StringEquals:
                    'aws:ResourceTag/codexcrew:managed': 'true'

  ReaperFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: codexcrew-deploy-reaper
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ReaperRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          BUCKET: !Ref Bucket
          DIST_ID: !Ref DistributionId
          # R30 F2: the reaper role has no sts:GetCallerIdentity permission, so
          # the lambda's STS fallback for account-id discovery fails as
          # AccessDenied and every engine-arch reap returns "reaping" forever
          # (expired resources leak). Supply the account id directly.
          ACCOUNT_ID: !Ref AWS::AccountId
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Tags:
        - { Key: 'codexcrew:managed', Value: 'true' }

  Schedule:
    Type: AWS::Events::Rule
    Properties:
      Name: codexcrew-deploy-reaper
      Description: CodexCrew deploy TTL reaper schedule
      ScheduleExpression: !Ref ScheduleRate
      State: ENABLED
      Targets:
        - Arn: !GetAtt ReaperFn.Arn
          Id: reaper

  SchedulePerm:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReaperFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Schedule.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      KmsMasterKeyId: alias/aws/sns  # wokeignore:rule=master
      Subscription:
        - Endpoint: !Ref AlarmEmail
          Protocol: email
      Tags:
        - Key: 'codexcrew:managed'
          Value: 'true'

  ReaperErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: >-
        Reaper Lambda is throwing. Expired codexcrew deployments are NOT being
        cleaned up; investigate the function logs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ReaperFn
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  ReaperFunctionName:
    Value: !Ref ReaperFn
  ScheduleRate:
    Value: !Ref ScheduleRate
